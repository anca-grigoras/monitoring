openapi: 3.0.3
info:
  title: Monitoring Service API
  description: |
    A monitoring service for handling webhook alerts from external monitoring systems.
    Supports Datadog and Grafana alert webhooks.
  version: 1.0.0
  contact:
    name: NDW Realtime Team

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /internal/v1/teams/{teamId}/datadog-receiver:
    post:
      summary: Receive Datadog alert webhook
      description: |
        Endpoint for receiving alert notifications from Datadog.
        Processes incoming alerts and creates or updates incidents and alerts in the system.

        **Datadog Webhook Body Template**

        When configuring the webhook in Datadog, use the following JSON body template:

        ```json
        {
          "alerts": [
            {
              "alertTransition": "$ALERT_TRANSITION",
              "alertId": "$ALERT_ID",
              "alertScope": "$ALERT_SCOPE",
              "alertTitle": "$ALERT_TITLE",
              "date": "$DATE",
              "environment": "$ENV",
              "tags": "$TAGS"
            }
          ],
          "commonLabels": {
            "alertname": "$ALERT_TITLE",
            "ruleId": "$ALERT_ID"
          }
        }
        ```

        All fields use standard Datadog webhook variables (`$VARIABLE_NAME`).
        The service name is extracted server-side from the `service:` tag in `$TAGS`.
      operationId: handleDatadogAlert
      tags:
        - Datadog
      parameters:
        - name: teamId
          in: path
          required: true
          description: UUID of the team that owns the receiver
          schema:
            type: string
            format: uuid
            example: "a33098a8-ed37-4af0-826a-6c0dbf39ebf3"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Datadog alert payload (after template variable resolution)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatadogAlertRequest'
            examples:
              triggered:
                summary: Triggered alert
                value:
                  alerts:
                    - alertTransition: "Triggered"
                      alertId: "12345678"
                      alertScope: "host:web-server-01"
                      alertTitle: "High CPU Usage Alert"
                      date: 1769433745000
                      environment: "prod"
                      tags: "fd,monitor,priority:p1,service:api-gateway,team:dev"
                  commonLabels:
                    alertname: "High CPU Usage Alert"
                    ruleId: "12345678"
              noData:
                summary: No Data alert
                value:
                  alerts:
                    - alertTransition: "No Data"
                      alertId: "d8e9d4934258fbc4"
                      alertScope: ""
                      alertTitle: "[TEST] NCIS-CN: FCD data interrupted"
                      date: 1769433745000
                      environment: "prod"
                      tags: "fd,monitor,ncis-cn,priority:p1,service:FCD CN receiver,team:dev"
                  commonLabels:
                    alertname: "[TEST] NCIS-CN: FCD data interrupted"
                    ruleId: "d8e9d4934258fbc4"
              recovered:
                summary: Recovered alert
                value:
                  alerts:
                    - alertTransition: "Recovered"
                      alertId: "d8e9d4934258fbc4"
                      alertScope: ""
                      alertTitle: "[TEST] NCIS-CN: FCD data interrupted"
                      date: 1769433745000
                      environment: "prod"
                      tags: "fd,monitor,ncis-cn,priority:p1,service:FCD CN receiver,team:dev"
                  commonLabels:
                    alertname: "[TEST] NCIS-CN: FCD data interrupted"
                    ruleId: "d8e9d4934258fbc4"
      responses:
        '204':
          description: Alert received and processed successfully
        '400':
          description: Invalid request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "about:blank"
                title: "Bad Request"
                status: 400
                detail: "Invalid request content."
                instance: "/internal/v1/teams/a33098a8-ed37-4af0-826a-6c0dbf39ebf3/datadog-receiver"
        '401':
          description: Unauthorized - invalid or missing bearer token
        '404':
          description: Service not found for the alert's service name

  /internal/v1/teams/{teamId}/grafana-receiver:
    post:
      summary: Receive Grafana alert webhook
      description: |
        Endpoint for receiving alert notifications from Grafana.
        Processes incoming alerts and creates or updates incidents and alerts in the system.

        This endpoint expects a custom payload produced by a Grafana webhook contact point
        configured with a Custom Payload template (requires Grafana 12+).

        **Grafana Webhook Custom Payload Template**

        Configure the webhook contact point with the following Custom Payload template:

        ```
        {{ $alerts := coll.Slice }}
        {{ range .Alerts }}
        {{ $alerts = coll.Append (coll.Dict "status" .Status "fingerprint" .Fingerprint "alertname" (index .Labels "alertname") "service" (index .Labels "service_name") "environment" $.Vars.environment "description" (index .Annotations "summary") "startsAt" .StartsAt "endsAt" .EndsAt) $alerts }}
        {{ end }}
        {{ coll.Dict "alerts" $alerts "commonLabels" (coll.Dict "alertname" (index .CommonLabels "alertname") "ruleId" (index .CommonLabels "alertname")) | data.ToJSON }}
        ```

        **Vars** (configured per Grafana instance):
        - `environment` — e.g., `prod` for production, `staging` for staging

        **Required Grafana alert rule labels:**
        - `alertname` — always present (standard Grafana label), used as alert ID and rule ID
        - `service_name` — must be added as a custom label on the alert rule

        **Optional annotations:**
        - `summary` — used as the alert description
      operationId: handleGrafanaAlert
      tags:
        - Grafana
      parameters:
        - name: teamId
          in: path
          required: true
          description: UUID of the team that owns the receiver
          schema:
            type: string
            format: uuid
            example: "a33098a8-ed37-4af0-826a-6c0dbf39ebf3"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Grafana alert payload (after custom payload template rendering)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrafanaAlertRequest'
            examples:
              firing:
                summary: Firing alert
                value:
                  alerts:
                    - status: "firing"
                      fingerprint: "326ea703b01f6100"
                      alertname: "WARN|ERROR logging"
                      service: "ncis/ignite-tariffs-consumer-deployment"
                      environment: "prod"
                      description: "Notification test"
                      startsAt: "2026-01-26T19:29:52.490787568Z"
                      endsAt: "0001-01-01T00:00:00Z"
                  commonLabels:
                    alertname: "WARN|ERROR logging"
                    ruleId: "WARN|ERROR logging"
              resolved:
                summary: Resolved alert
                value:
                  alerts:
                    - status: "resolved"
                      fingerprint: "326ea703b01f6100"
                      alertname: "WARN|ERROR logging"
                      service: "ncis/ignite-tariffs-consumer-deployment"
                      environment: "prod"
                      description: "Notification test"
                      startsAt: "2026-01-26T19:29:52.490787568Z"
                      endsAt: "2026-01-26T19:35:00.000000000Z"
                  commonLabels:
                    alertname: "WARN|ERROR logging"
                    ruleId: "WARN|ERROR logging"
      responses:
        '204':
          description: Alert received and processed successfully
        '400':
          description: Invalid request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "about:blank"
                title: "Bad Request"
                status: 400
                detail: "Invalid request content."
                instance: "/internal/v1/teams/a33098a8-ed37-4af0-826a-6c0dbf39ebf3/grafana-receiver"
        '401':
          description: Unauthorized - invalid or missing bearer token
        '404':
          description: Service not found for the alert's service name

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Team-specific bearer token obtained from the token endpoint

  schemas:
    DatadogAlertRequest:
      type: object
      description: Datadog alert webhook payload with nested alerts and common labels
      required:
        - alerts
      properties:
        alerts:
          type: array
          description: List of alert entries (must contain at least one)
          minItems: 1
          items:
            $ref: '#/components/schemas/DatadogAlert'
        commonLabels:
          $ref: '#/components/schemas/DatadogCommonLabels'

    DatadogAlert:
      type: object
      description: Individual Datadog alert entry
      required:
        - alertTransition
        - alertId
        - alertTitle
        - date
        - environment
        - tags
      properties:
        alertTransition:
          type: string
          description: |
            Alert state transition. Maps from Datadog webhook variable `$ALERT_TRANSITION`.
          enum:
            - Triggered
            - Warn
            - Recovered
            - No Data
            - Re-Triggered
          example: "Triggered"
        alertId:
          type: string
          description: |
            Unique identifier for the alert monitor. Maps from Datadog webhook variable `$ALERT_ID`.
          example: "d8e9d4934258fbc4"
        alertScope:
          type: string
          description: |
            Scope of the alert. Maps from Datadog webhook variable `$ALERT_SCOPE`.
            Used together with alertId to compute the alert fingerprint.
            Can be empty string when no scope is defined.
          example: "host:web-server-01"
        alertTitle:
          type: string
          description: |
            Title of the alert. Maps from Datadog webhook variable `$ALERT_TITLE`.
          example: "[TEST] NCIS-CN: FCD data interrupted"
        date:
          type: integer
          format: int64
          description: |
            Timestamp of the alert in epoch milliseconds. Maps from Datadog webhook variable `$DATE`.
          example: 1769433745000
        environment:
          type: string
          description: |
            Environment where the alert originated. Maps from Datadog webhook variable `$ENV`.
          example: "prod"
        tags:
          type: string
          description: |
            Comma-separated tags from Datadog. Maps from webhook variable `$TAGS`.
            The service name is extracted server-side from the `service:` tag.
          example: "fd,monitor,ncis-cn,priority:p1,service:FCD CN receiver,team:dev"

    DatadogCommonLabels:
      type: object
      description: Common labels shared across all alerts in the payload
      required:
        - alertname
        - ruleId
      properties:
        alertname:
          type: string
          description: Display name of the alert rule
          example: "[TEST] NCIS-CN: FCD data interrupted"
        ruleId:
          type: string
          description: Identifier of the alert rule
          example: "d8e9d4934258fbc4"

    GrafanaAlertRequest:
      type: object
      description: |
        Grafana alert webhook payload produced by the Custom Payload template.
        The template extracts only the fields needed by the monitoring service
        from the native Grafana webhook format.
      required:
        - alerts
      properties:
        alerts:
          type: array
          description: List of alert instances (must contain at least one)
          minItems: 1
          items:
            $ref: '#/components/schemas/GrafanaAlert'
        commonLabels:
          $ref: '#/components/schemas/GrafanaCommonLabels'

    GrafanaAlert:
      type: object
      description: Individual Grafana alert instance
      required:
        - status
        - fingerprint
        - alertname
        - service
        - startsAt
      properties:
        status:
          type: string
          description: Current alert state
          enum:
            - firing
            - resolved
          example: "firing"
        fingerprint:
          type: string
          description: |
            Unique hash identifying this alert instance (based on label set).
            Generated by Grafana.
          example: "326ea703b01f6100"
        alertname:
          type: string
          description: |
            Name of the alert rule. Extracted from Grafana's `alertname` label.
            Used as the alert ID.
          example: "WARN|ERROR logging"
        service:
          type: string
          description: |
            Service name. Extracted from the `service_name` custom label on the alert rule.
          example: "ncis/ignite-tariffs-consumer-deployment"
        environment:
          type: string
          description: |
            Environment where the alert originated. Hardcoded per Grafana instance
            via the `environment` Var in the Custom Payload template.
          example: "prod"
        description:
          type: string
          description: |
            Alert description. Extracted from the `summary` annotation on the alert rule.
          example: "Notification test"
        startsAt:
          type: string
          format: date-time
          description: Time when the alert started firing
          example: "2026-01-26T19:29:52.490787568Z"
        endsAt:
          type: string
          format: date-time
          description: |
            Time when the alert ended. Grafana sends `0001-01-01T00:00:00Z` for
            ongoing alerts, which is converted to null server-side.
          example: "0001-01-01T00:00:00Z"

    GrafanaCommonLabels:
      type: object
      description: Common labels shared across all alerts in the payload
      required:
        - alertname
        - ruleId
      properties:
        alertname:
          type: string
          description: Display name of the alert rule
          example: "WARN|ERROR logging"
        ruleId:
          type: string
          description: |
            Identifier of the alert rule. In Grafana, this is set to the same
            value as `alertname` since Grafana has no separate rule ID concept.
          example: "WARN|ERROR logging"

    ProblemDetail:
      type: object
      description: RFC 7807 Problem Details response
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
          example: "about:blank"
        title:
          type: string
          description: Short human-readable summary of the problem
          example: "Bad Request"
        status:
          type: integer
          description: HTTP status code
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          example: "Invalid request content."
        instance:
          type: string
          description: URI reference identifying the specific occurrence
          example: "/internal/v1/teams/a33098a8-ed37-4af0-826a-6c0dbf39ebf3/datadog-receiver"

tags:
  - name: Datadog
    description: Datadog webhook receiver endpoints
  - name: Grafana
    description: Grafana webhook receiver endpoints
