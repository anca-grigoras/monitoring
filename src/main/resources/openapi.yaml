openapi: 3.0.3
info:
  title: Monitoring Service API
  description: |
    A monitoring service for handling webhook alerts from external monitoring systems.
    Supports Datadog and Grafana alert webhooks.
  version: 1.0.0
  contact:
    name: NDW Realtime Team

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /internal/v1/teams/{teamId}/datadog-receiver:
    post:
      summary: Receive Datadog alert webhook
      description: |
        Endpoint for receiving alert notifications from Datadog.
        Processes incoming alerts and creates or updates incidents and alerts in the system.

        **Datadog Webhook Body Template**

        When configuring the webhook in Datadog, use the following JSON body template:

        ```json
        {
          "alerts": [
            {
              "alertTransition": "$ALERT_TRANSITION",
              "alertId": "$ALERT_ID",
              "alertScope": "$ALERT_SCOPE",
              "alertTitle": "$ALERT_TITLE",
              "date": "$DATE",
              "environment": "$ENV",
              "service": "{{service.name}}"
            }
          ],
          "commonLabels": {
            "alertname": "$ALERT_TITLE",
            "ruleId": "$ALERT_ID"
          }
        }
        ```

        Note: Most fields use Datadog webhook variables (`$VARIABLE_NAME`), but
        `service` uses the Datadog notification template variable `{{service.name}}`
        which resolves to the APM service name associated with the alert.
      operationId: handleDatadogAlert
      tags:
        - Datadog
      parameters:
        - name: teamId
          in: path
          required: true
          description: UUID of the team that owns the receiver
          schema:
            type: string
            format: uuid
            example: "a33098a8-ed37-4af0-826a-6c0dbf39ebf3"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Datadog alert payload (after template variable resolution)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatadogAlertRequest'
            examples:
              triggered:
                summary: Triggered alert
                value:
                  alerts:
                    - alertTransition: "Triggered"
                      alertId: "12345678"
                      alertScope: "host:web-server-01"
                      alertTitle: "High CPU Usage Alert"
                      date: 1769433745000
                      environment: "prod"
                      service: "api-gateway"
                  commonLabels:
                    alertname: "High CPU Usage Alert"
                    ruleId: "12345678"
              noData:
                summary: No Data alert
                value:
                  alerts:
                    - alertTransition: "No Data"
                      alertId: "d8e9d4934258fbc4"
                      alertScope: ""
                      alertTitle: "[TEST] NCIS-CN: FCD data interrupted"
                      date: 1769433745000
                      environment: "prod"
                      service: "FCD CN receiver"
                  commonLabels:
                    alertname: "[TEST] NCIS-CN: FCD data interrupted"
                    ruleId: "d8e9d4934258fbc4"
              recovered:
                summary: Recovered alert
                value:
                  alerts:
                    - alertTransition: "Recovered"
                      alertId: "d8e9d4934258fbc4"
                      alertScope: ""
                      alertTitle: "[TEST] NCIS-CN: FCD data interrupted"
                      date: 1769433745000
                      environment: "prod"
                      service: "FCD CN receiver"
                  commonLabels:
                    alertname: "[TEST] NCIS-CN: FCD data interrupted"
                    ruleId: "d8e9d4934258fbc4"
      responses:
        '204':
          description: Alert received and processed successfully
        '400':
          description: Invalid request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "about:blank"
                title: "Bad Request"
                status: 400
                detail: "Invalid request content."
                instance: "/internal/v1/teams/a33098a8-ed37-4af0-826a-6c0dbf39ebf3/datadog-receiver"
        '401':
          description: Unauthorized - invalid or missing bearer token
        '404':
          description: Service not found for the alert's service name

  /internal/v1/teams/{teamId}/grafana-receiver:
    post:
      summary: Receive Grafana alert webhook
      description: |
        Endpoint for receiving alert notifications from Grafana.
        Processes incoming alerts and creates or updates incidents and alerts in the system.
      operationId: handleGrafanaAlert
      tags:
        - Grafana
      parameters:
        - name: teamId
          in: path
          required: true
          description: UUID of the team that owns the receiver
          schema:
            type: string
            format: uuid
            example: "a33098a8-ed37-4af0-826a-6c0dbf39ebf3"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Grafana alert payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrafanaAlertRequest'
      responses:
        '204':
          description: Alert received and processed successfully
        '400':
          description: Invalid request - validation error
        '401':
          description: Unauthorized - invalid or missing bearer token
        '404':
          description: Service not found for the alert's service name

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Team-specific bearer token obtained from the token endpoint

  schemas:
    DatadogAlertRequest:
      type: object
      description: Datadog alert webhook payload with nested alerts and common labels
      required:
        - alerts
      properties:
        alerts:
          type: array
          description: List of alert entries (must contain at least one)
          minItems: 1
          items:
            $ref: '#/components/schemas/DatadogAlert'
        commonLabels:
          $ref: '#/components/schemas/DatadogCommonLabels'

    DatadogAlert:
      type: object
      description: Individual Datadog alert entry
      required:
        - alertTransition
        - alertId
        - alertTitle
        - date
        - environment
        - service
      properties:
        alertTransition:
          type: string
          description: |
            Alert state transition. Maps from Datadog webhook variable `$ALERT_TRANSITION`.
          enum:
            - Triggered
            - Warn
            - Recovered
            - No Data
            - Re-Triggered
          example: "Triggered"
        alertId:
          type: string
          description: |
            Unique identifier for the alert monitor. Maps from Datadog webhook variable `$ALERT_ID`.
          example: "d8e9d4934258fbc4"
        alertScope:
          type: string
          description: |
            Scope of the alert. Maps from Datadog webhook variable `$ALERT_SCOPE`.
            Used together with alertId to compute the alert fingerprint.
            Can be empty string when no scope is defined.
          example: "host:web-server-01"
        alertTitle:
          type: string
          description: |
            Title of the alert. Maps from Datadog webhook variable `$ALERT_TITLE`.
          example: "[TEST] NCIS-CN: FCD data interrupted"
        date:
          type: integer
          format: int64
          description: |
            Timestamp of the alert in epoch milliseconds. Maps from Datadog webhook variable `$DATE`.
          example: 1769433745000
        environment:
          type: string
          description: |
            Environment where the alert originated. Maps from Datadog webhook variable `$ENV`.
          example: "prod"
        service:
          type: string
          description: |
            APM service name associated with the alert. Maps from Datadog notification
            template variable `{{service.name}}` (not a standard `$` webhook variable).
          example: "FCD CN receiver"

    DatadogCommonLabels:
      type: object
      description: Common labels shared across all alerts in the payload
      required:
        - alertname
        - ruleId
      properties:
        alertname:
          type: string
          description: Display name of the alert rule
          example: "[TEST] NCIS-CN: FCD data interrupted"
        ruleId:
          type: string
          description: Identifier of the alert rule
          example: "d8e9d4934258fbc4"

    GrafanaAlertRequest:
      type: object
      description: Grafana alert webhook payload (schema to be defined)

    ProblemDetail:
      type: object
      description: RFC 7807 Problem Details response
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
          example: "about:blank"
        title:
          type: string
          description: Short human-readable summary of the problem
          example: "Bad Request"
        status:
          type: integer
          description: HTTP status code
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          example: "Invalid request content."
        instance:
          type: string
          description: URI reference identifying the specific occurrence
          example: "/internal/v1/teams/a33098a8-ed37-4af0-826a-6c0dbf39ebf3/datadog-receiver"

tags:
  - name: Datadog
    description: Datadog webhook receiver endpoints
  - name: Grafana
    description: Grafana webhook receiver endpoints
